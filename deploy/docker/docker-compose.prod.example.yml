services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dumptether-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${DUMPTETHER_API_IMAGE}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: ${DUMPTETHER_DATABASE_PROVIDER:-Postgres}
      Database__ApplyMigrationsOnStartup: ${DUMPTETHER_APPLY_MIGRATIONS_ON_STARTUP:-false}
      Auth__RequireAuthentication: ${DUMPTETHER_REQUIRE_AUTHENTICATION:-true}
      Auth__AllowGuestSessions: ${DUMPTETHER_ALLOW_GUEST_SESSIONS:-false}
      Auth__SignupMode: ${DUMPTETHER_SIGNUP_MODE:-InviteOnly}
      Auth__SignupWhitelistEmails__0: ${DUMPTETHER_SIGNUP_WHITELIST_EMAIL_0}
      Auth__SignupWhitelistDomains__0: ${DUMPTETHER_SIGNUP_WHITELIST_DOMAIN_0}
      Auth__SignupInviteCodes__0: ${DUMPTETHER_SIGNUP_INVITE_CODE_0}
      Auth__EnableDevelopmentLogin: ${DUMPTETHER_ENABLE_DEVELOPMENT_LOGIN:-false}
      Auth__EnableLocalDesktopLogin: ${DUMPTETHER_ENABLE_LOCAL_DESKTOP_LOGIN:-false}
      Auth__SessionDays: ${DUMPTETHER_AUTH_SESSION_DAYS:-30}
      Auth__SessionCleanupDays: ${DUMPTETHER_AUTH_SESSION_CLEANUP_DAYS:-90}
      Auth__SessionCleanupIntervalHours: ${DUMPTETHER_AUTH_SESSION_CLEANUP_INTERVAL_HOURS:-24}
      Archive__RetentionDays: ${DUMPTETHER_ARCHIVE_RETENTION_DAYS:-30}
      Cors__AllowedOrigins__0: ${DUMPTETHER_CORS_ALLOWED_ORIGIN_0}
      EmailConfirmation__Enabled: ${DUMPTETHER_EMAIL_CONFIRMATION_ENABLED:-false}
      EmailConfirmation__PublicBaseUrl: ${DUMPTETHER_EMAIL_CONFIRMATION_PUBLIC_BASE_URL}
      Email__FromEmail: ${DUMPTETHER_EMAIL_FROM}
      Email__FromName: ${DUMPTETHER_EMAIL_FROM_NAME:-DumpTether}
      Email__Provider: ${DUMPTETHER_EMAIL_PROVIDER:-None}
      Email__Smtp__Host: ${DUMPTETHER_EMAIL_SMTP_HOST}
      Email__Smtp__Port: ${DUMPTETHER_EMAIL_SMTP_PORT:-587}
      Email__Smtp__UseAuthentication: ${DUMPTETHER_EMAIL_SMTP_USE_AUTHENTICATION:-true}
      Email__Smtp__EnableSsl: ${DUMPTETHER_EMAIL_SMTP_ENABLE_SSL:-true}
      Email__Smtp__Username: ${DUMPTETHER_EMAIL_SMTP_USERNAME}
      Email__Smtp__Password: ${DUMPTETHER_EMAIL_SMTP_PASSWORD}
      Email__BrevoApi__ApiKey: ${DUMPTETHER_EMAIL_BREVO_API_KEY}
      Mfa__Email__Enabled: ${DUMPTETHER_EMAIL_MFA_ENABLED:-false}
      OAuth__Microsoft__Enabled: ${DUMPTETHER_OAUTH_MICROSOFT_ENABLED:-false}
      OAuth__Microsoft__ClientId: ${DUMPTETHER_OAUTH_MICROSOFT_CLIENT_ID}
      OAuth__Microsoft__ClientSecret: ${DUMPTETHER_OAUTH_MICROSOFT_CLIENT_SECRET}
      OAuth__Microsoft__TenantId: ${DUMPTETHER_OAUTH_MICROSOFT_TENANT_ID:-common}
      Usage__MaxActiveTasksPerWorkspace: ${DUMPTETHER_MAX_ACTIVE_TASKS_PER_WORKSPACE:-1000}
      Usage__MaxTotalTasksPerWorkspace: ${DUMPTETHER_MAX_TOTAL_TASKS_PER_WORKSPACE:-5000}
      ConnectionStrings__DumpTether: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DUMPTETHER_DOMAIN: ${DUMPTETHER_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - dumptether-caddy-data:/data
      - dumptether-caddy-config:/config
    depends_on:
      - api

volumes:
  dumptether-postgres-data:
  dumptether-caddy-data:
  dumptether-caddy-config:
