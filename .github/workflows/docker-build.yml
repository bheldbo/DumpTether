name: Docker Build

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  api-image:
    name: Production Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f src/DumpTether.Api/Dockerfile -t dumptether-api:ci .

      - name: Build web Docker image
        run: docker build -f apps/web/Dockerfile -t dumptether-web:ci .

      - name: Validate local compose
        run: docker compose -f docker-compose.local.yml config

      - name: Validate production compose example
        run: docker compose --env-file deploy/docker/.env.prod.example -f deploy/docker/docker-compose.prod.example.yml config
