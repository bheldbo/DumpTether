services:
  postgres:
    image: postgres:16-alpine
    container_name: dumptether-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dumptether}
      POSTGRES_USER: ${POSTGRES_USER:-dumptether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dumptether_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - dumptether-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dumptether} -d ${POSTGRES_DB:-dumptether}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: dumptether-mailpit
    profiles:
      - mail
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  dumptether-postgres-data:
