services:
  postgres:
    image: postgres:16-alpine
    container_name: dumptether-postgres
    environment:
      POSTGRES_DB: dumptether
      POSTGRES_USER: dumptether
      POSTGRES_PASSWORD: dumptether_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dumptether-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dumptether -d dumptether"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dumptether-postgres-data:
